name: Build MosesTech AI Release
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev liblzma-dev

    - name: Build with Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython virtualenv
        buildozer android release
        
    - name: Upload Finished Play Store Bundle
      uses: actions/upload-artifact@v4
      with:
        name: play-store-bundle
        path: bin/*.aab
